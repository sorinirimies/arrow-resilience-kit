[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
# template for the changelog body. Sections are ordered by the <!-- N --> prefix of their group
# name (stripped when rendered); the scope is shown in bold and the `type:` prefix is dropped,
# since the section heading already says it.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/sorinirimies/arrow-resilience-kit/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% set automation = commits | filter(attribute="group", value="<!-- 99 -->release") | length -%}
{% if automation == commits | length %}
_Maintenance release: version bump and generated files only._
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
{% if group != "<!-- 99 -->release" %}
### {{ group | striptags | trim }}

{% for commit in commits -%}
- {% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.breaking %} **[BREAKING]**{% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/sorinirimies/arrow-resilience-kit/commit/{{ commit.id }}))
{% endfor -%}
{% endif -%}
{% endfor -%}
{% if version and previous.version %}
**Full Changelog**: https://github.com/sorinirimies/arrow-resilience-kit/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
# whitespace is controlled by the template ({%- -%}): each release ends with one blank line;
# the postprocessors drop leading blank lines and collapse any run of blank lines to one
trim = false
postprocessors = [
    { pattern = '^\n+', replace = "" },
    { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
# parse type(scope): message, but keep commits that don't follow the convention too
conventional_commits = true
filter_unconventional = false
# regex for parsing and grouping commits (matched against the full subject line)
commit_parsers = [
    # Merge commits only join histories; their content is listed through the merged commits.
    { message = "^Merge (branch|remote-tracking branch|pull request)", skip = true },
    # Release automation and bots: grouped out of sight (see the body template), but they keep
    # releases that contain nothing else listed.
    { message = "^chore: bump version to", group = "<!-- 99 -->release" },
    { message = "^chore: update Package\\.swift for", group = "<!-- 99 -->release" },
    { message = "^docs: update API documentation for", group = "<!-- 99 -->release" },
    { message = "^[Cc]hore\\(deps\\): nightly dependency upgrade", group = "<!-- 99 -->release" },
    { message = "^[Cc]hore\\(release\\): prepare for", skip = true },
    { message = "^[Cc]hore\\(pr\\)", skip = true },
    { message = "^[Cc]hore\\(pull\\)", skip = true },
    { message = "^[Ff]eat(?:\\(.*\\))?:?\\s", group = "<!-- 0 -->✨ Features" },
    { message = "^[Ii]ntroduce\\s", group = "<!-- 0 -->✨ Features" },
    { message = "^[Ff]ix(?:\\(.*\\))?:?\\s", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^[Pp]erf(?:\\(.*\\))?:?\\s", group = "<!-- 2 -->⚡ Performance" },
    { message = "^[Rr]efactor(?:\\(.*\\))?:?\\s", group = "<!-- 3 -->♻️ Refactor" },
    { message = "^[Dd]ocs?(?:\\(.*\\))?:?\\s", group = "<!-- 4 -->📚 Documentation" },
    { message = "^[Tt]est(?:\\(.*\\))?:?\\s", group = "<!-- 5 -->🧪 Testing" },
    { message = "^([Bb]uild|[Cc]hore)\\(deps\\)", group = "<!-- 6 -->⬆️ Dependencies" },
    { message = "^[Bb]uild(?:\\(.*\\))?:?\\s", group = "<!-- 7 -->📦 Build" },
    { message = "^[Cc]i(?:\\(.*\\))?:?\\s", group = "<!-- 8 -->🔄 CI" },
    { message = "^[Ss]tyle(?:\\(.*\\))?:?\\s", group = "<!-- 9 -->💄 Styling" },
    { message = "^[Cc]hore(?:\\(.*\\))?:?\\s", group = "<!-- 10 -->🔧 Chores" },
    { message = "^([Aa]dd|[Uu]pdate|[Ee]nhance|[Ii]mprove)\\s", group = "<!-- 11 -->📈 Improvements" },
    { message = ".*", group = "<!-- 12 -->📦 Other Changes" },
]
# filter out the commits that are not matched by commit_parsers
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "[0-9]*"
# sort the tags chronologically
sort_tags = true
# protect breaking changes from being skipped due to matching skip pattern
protect_breaking_commits = true
# list commits in the order they were made
sort_commits = "oldest"

[remote.github]
owner = "sorinirimies"
repo = "arrow-resilience-kit"
