version: 2
updates:
  # Workflow and composite actions (.github/workflows, .github/actions/*).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"

  # Gradle version catalog + build scripts. The nightly deps-update workflow
  # also upgrades these; Dependabot PRs it already covered close themselves.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Deliberately pinned to the 2.2 line (consumer compatibility), same as
      # CATALOG_POLICY in scripts/upgrade_deps.nu: patch bumps only.
      - dependency-name: "org.jetbrains.kotlin:kotlin-stdlib"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      gradle:
        update-types: [minor, patch]
    commit-message:
      prefix: "build"
