name: Release

on:
  push:
    tags:
      - "[0-9]*"
  # Manual fallback — trigger from the GitHub Actions UI if the tag push
  # ever silently skips or a re-run is needed without re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. 0.2.0) — must already exist on the repo"
        required: true
        default: ""

permissions:
  contents: write
  packages: write

# Only one release at a time.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # ── 0. Validate trigger ──────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # For workflow_dispatch, github.ref_name/checkout's default ref is the
      # branch that triggered it (main), NOT the tag being released -- the
      # tag comes from the `tag` input instead. Checking out the requested
      # tag explicitly here (not just "main") is what lets the version check
      # below compare against that tag's own build.gradle.kts, not main's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Install Nushell
        run: |
          NU_VERSION=$(curl -sSfL https://api.github.com/repos/nushell/nushell/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          curl -sSfL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv "nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/

      - name: Validate tag
        id: resolve
        run: nu scripts/validate_tag.nu "$TAG" | tee -a "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

  # ── 1. Quality gate ──────────────────────────────────────────────────────────
  test:
    name: Test & lint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
        with:
          # Pins the known-good gradle-wrapper.jar checksum for our pinned Gradle
          # version (verified against the official gradle/gradle v9.8.0 tag) so this
          # step never falls back to fetching checksums over the network — that
          # network fallback was flaking with ECONNRESET on the self-hosted runner.
          allow-checksums: 238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5

      - name: Build project
        run: ./gradlew build --no-daemon --stacktrace

      - name: Run tests
        run: ./gradlew allTests --no-daemon --stacktrace

  # ── 2. Create GitHub Release ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          cargo install git-cliff --locked

      - name: Install Nushell
        run: |
          NU_VERSION=$(curl -sSfL https://api.github.com/repos/nushell/nushell/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          curl -sSfL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv "nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/

      - name: Generate release notes
        run: nu scripts/release_notes.nu "${{ needs.validate.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            LICENSE
            README.md
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 3. Build & attach iOS XCFramework (Swift Package Manager) ────────────────────────
  xcframework:
    name: Build & attach XCFramework (iOS)
    needs: [validate, release, publish]
    # Runs after `publish` (which may also push a commit to main for docs)
    # so the two git-push steps don't race each other on the same branch.
    # Kotlin/Native's iOS targets (and lipo/xcodebuild -create-xcframework)
    # can only be built on a Mac with Xcode installed — this is the only job
    # in either release workflow that needs macos-latest instead of Ubuntu.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Install Nushell
        run: brew install nushell

      - name: Build ArrowResilienceKit.xcframework
        run: ./gradlew assembleArrowResilienceKitReleaseXCFramework --no-daemon

      - name: Zip XCFramework
        run: |
          cd build/XCFrameworks/release
          zip -r -y -q ArrowResilienceKit.xcframework.zip ArrowResilienceKit.xcframework

      - name: Upload XCFramework to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "${{ needs.validate.outputs.tag }}"
          build/XCFrameworks/release/ArrowResilienceKit.xcframework.zip
          --clobber

      - name: Update Package.swift for this release
        run: |
          CHECKSUM=$(swift package compute-checksum build/XCFrameworks/release/ArrowResilienceKit.xcframework.zip)
          nu scripts/update_package_swift.nu --tag "${{ needs.validate.outputs.tag }}" --checksum "$CHECKSUM"

      - name: Commit and push Package.swift
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          git checkout main
          git add Package.swift
          git diff --staged --quiet || git commit -m "chore: update Package.swift for ${{ needs.validate.outputs.tag }}"
          git push origin main

  # ── 4. Publish to GitHub Packages ───────────────────────────────────────────
  publish:
    name: Publish to GitHub Packages
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.PACKAGES_PUBLISH != '' }}
      HAS_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' }}
      HAS_ANY_TARGET: ${{ secrets.PACKAGES_PUBLISH != '' || secrets.MAVEN_CENTRAL_USERNAME != '' }}
    steps:
      - name: Skip notice (no token)
        if: env.HAS_ANY_TARGET != 'true'
        run: echo "⏭️  Neither PACKAGES_PUBLISH nor MAVEN_CENTRAL_USERNAME is configured — skipping publish."

      - uses: actions/checkout@v4
        if: env.HAS_ANY_TARGET == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up JDK 17
        if: env.HAS_ANY_TARGET == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        if: env.HAS_ANY_TARGET == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Publish to GitHub Packages
        if: env.HAS_TOKEN == 'true'
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          PACKAGES_PUBLISH: ${{ secrets.PACKAGES_PUBLISH }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish to Maven Central
        if: env.HAS_CENTRAL_TOKEN == 'true'
        # publishToCentralPortal stages, zips, and uploads the bundle with
        # publishingType=AUTOMATIC (gradle/central-portal.gradle.kts), which
        # triggers Sonatype's auto validate+release; see INSTALLATION.md for
        # the one-time Central Portal namespace verification this requires.
        run: ./gradlew publishToCentralPortal --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate and deploy documentation
        if: env.HAS_ANY_TARGET == 'true'
        run: |
          ./gradlew dokkaGeneratePublicationHtml --no-daemon

          rm -rf docs/
          mkdir -p docs
          cp -r build/docs/* docs/
          touch docs/.nojekyll

          echo "<!-- Generated by GitHub Actions -->" > docs/VERSION.html
          echo "<p>Version: ${{ needs.validate.outputs.tag }}</p>" >> docs/VERSION.html
          echo "<p>Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>" >> docs/VERSION.html
          echo "<p>Commit: ${{ github.sha }}</p>" >> docs/VERSION.html

      - name: Commit and push documentation
        if: env.HAS_ANY_TARGET == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          git checkout main
          git add docs/
          git diff --staged --quiet || git commit -m "docs: update API documentation for ${{ needs.validate.outputs.tag }}"
          git push origin main

      - name: Upload build artifacts
        if: env.HAS_ANY_TARGET == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/
            build/reports/
          retention-days: 7
