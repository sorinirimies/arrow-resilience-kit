name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

# Cancel in-progress runs on the same branch/PR so we never queue up stale
# jobs after a force-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── 1. Build ─────────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; the default 'enhanced' provider is a proprietary
          # component with separate terms of use (gradle/actions v6).
          cache-provider: basic
          cache-read-only: false

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
        with:
          # Pins the checksum of the gradle-wrapper.jar actually committed in this
          # repo (regenerated by the nightly deps-update bot -- not necessarily
          # byte-identical to gradle/gradle's own release tag, since jar generation
          # embeds timestamps, but that's fine: this only needs to match what's
          # actually checked out) so this step never falls back to fetching
          # checksums over the network -- that network fallback was flaking with
          # ECONNRESET on the self-hosted runner. Update this whenever the nightly
          # bot bumps gradle-wrapper.jar (shasum -a 256 gradle/wrapper/gradle-wrapper.jar).
          allow-checksums: 3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98

      - name: Build project
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Check public API (ABI)
        run: |
          ./gradlew checkKotlinAbi --no-daemon || {
            echo "::error::Public API changed. If intended, run './gradlew updateKotlinAbi' and commit api/."
            exit 1
          }

  # ── 2. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; the default 'enhanced' provider is a proprietary
          # component with separate terms of use (gradle/actions v6).
          cache-provider: basic
          cache-read-only: false

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run tests (JVM + JS) with coverage floor
        run: ./gradlew jvmTest jsNodeTest koverVerify koverXmlReport --no-daemon --stacktrace

      - name: Coverage summary
        if: always()
        run: |
          r=build/reports/kover/report.xml
          [ -f "$r" ] || exit 0
          line=$(grep -o '<counter type="LINE"[^>]*/>' "$r" | tail -1)
          missed=$(sed -n 's/.*missed="\([0-9]*\)".*/\1/p' <<<"$line")
          covered=$(sed -n 's/.*covered="\([0-9]*\)".*/\1/p' <<<"$line")
          pct=$(awk "BEGIN{printf \"%.1f\", 100*$covered/($covered+$missed)}")
          echo "### JVM line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Smoke-test the npm package (ESM/CJS, errors, abort, logging, .d.ts)
        run: |
          ./gradlew jsNodeProductionLibraryDistribution --no-daemon
          node scripts/npm_smoke/run.mjs

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/
            **/build/reports/
          retention-days: 7

  # ── 2b. Publish dry-run ────────────────────────────────────────────────────────
  # Builds every Maven publication (unsigned, to ~/.m2) and packs the npm
  # tarball, so packaging breakage shows up on the PR instead of at release.
  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Publish to Maven local
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: List published artifacts
        run: find ~/.m2/repository/io/github/sorinirimies -name '*.pom' | sort

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: npm pack (dry-run)
        run: |
          ./gradlew jsNodeProductionLibraryDistribution --no-daemon
          cd build/dist/js/productionLibrary
          npm pack --dry-run

  # ── 3. Lint (Detekt) ─────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; the default 'enhanced' provider is a proprietary
          # component with separate terms of use (gradle/actions v6).
          cache-provider: basic

      - name: Run detekt
        run: ./gradlew check --no-daemon --stacktrace

  # ── 4. Documentation ─────────────────────────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; the default 'enhanced' provider is a proprietary
          # component with separate terms of use (gradle/actions v6).
          cache-provider: basic

      - name: Generate Dokka documentation
        run: ./gradlew dokkaGeneratePublicationHtml --no-daemon --stacktrace

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: documentation
          path: build/docs/
          retention-days: 7
