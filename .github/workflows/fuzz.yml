name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main, master]
    paths: ["src/commonMain/**", "src/jvmMain/**", "src/jvmTest/**", "gradle/libs.versions.toml"]
  pull_request:
    paths: ["src/commonMain/**", "src/jvmMain/**", "src/jvmTest/**", "gradle/libs.versions.toml"]
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per property
        default: "200000"
      seed:
        description: Seed (empty = random)
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    name: randomised robustness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; the default 'enhanced' provider is a proprietary
          # component with separate terms of use (gradle/actions v6).
          cache-provider: basic
      - name: Install Nushell
        uses: ./.github/actions/setup-nu
      - name: Fuzz (a failure prints the seed that reproduces it)
        env:
          ITERS: ${{ github.event.inputs.iterations || (github.event_name == 'schedule' && '200000') || '5000' }}
          SEED: ${{ github.event.inputs.seed }}
        run: |
          if [ -n "$SEED" ]; then nu scripts/fuzz.nu --iters "$ITERS" --seed "$SEED"; else nu scripts/fuzz.nu --iters "$ITERS"; fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-reports
          path: build/reports/tests/
