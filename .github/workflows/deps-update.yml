name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:00 UTC every day (03:00 CET)
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: deps-update
  cancel-in-progress: true

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A PAT (optional) can push workflow-file changes; GITHUB_TOKEN cannot.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; the default 'enhanced' provider is a proprietary
          # component with separate terms of use (gradle/actions v6).
          cache-provider: basic
          cache-read-only: false

      - name: Install Nushell
        uses: ./.github/actions/setup-nu

      - name: Record HEAD before upgrade
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upgrade dependencies
        env:
          SKIP_GITHUB_WORKFLOW_SYNC: ${{ secrets.GH_PAT == '' }}
        run: nu scripts/upgrade_deps.nu --commit --bot-name "github-actions[bot]" --bot-email "github-actions[bot]@users.noreply.github.com"

      - name: Check whether dependencies changed
        id: diff
        run: |
          after="$(git rev-parse HEAD)"
          if [ "$after" != "${{ steps.before.outputs.sha }}" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      # Bumps a patch version, tags it, and dispatches the Release workflow —
      # so a dependency upgrade automatically produces a new build/release.
      - name: Auto-release new version
        if: steps.diff.outputs.updated == 'true'
        run: >
          nu scripts/auto_release.nu
          --platform github
          --repo "${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
