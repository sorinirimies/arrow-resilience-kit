name: Security

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, master]
    paths: ["build.gradle.kts", "settings.gradle.kts", "gradle/**", "scripts/security/**", "scripts/security_audit.nu"]
  pull_request:
    paths: ["build.gradle.kts", "settings.gradle.kts", "gradle/**", "scripts/security/**", "scripts/security_audit.nu"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "corretto"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache; the default 'enhanced' provider is a proprietary
          # component with separate terms of use (gradle/actions v6).
          cache-provider: basic
      - name: Install Nushell
        uses: ./.github/actions/setup-nu
      - name: Install osv-scanner
        run: |
          V=v2.2.2
          curl -fsSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/$V/osv-scanner_linux_amd64
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner || { mkdir -p $HOME/.local/bin; install -m 0755 /tmp/osv-scanner $HOME/.local/bin/osv-scanner; echo "$HOME/.local/bin" >> $GITHUB_PATH; }
      - name: Audit dependencies (fails on any known vulnerability)
        run: nu scripts/security_audit.nu
