name: Security

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, master]
    paths: ["build.gradle.kts", "settings.gradle.kts", "gradle/**", "scripts/security/**", "scripts/security_audit.nu"]
  pull_request:
    paths: ["build.gradle.kts", "settings.gradle.kts", "gradle/**", "scripts/security/**", "scripts/security_audit.nu"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Install Nushell
        run: |
          V=0.116.1
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/dl.tgz https://github.com/nushell/nushell/releases/download/$V/nu-$V-x86_64-unknown-linux-gnu.tar.gz && tar -xzf /tmp/dl.tgz -C /tmp
          sudo install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu /usr/local/bin/nu || { mkdir -p $HOME/.cargo/bin; install -m 0755 /tmp/nu-$V-x86_64-unknown-linux-gnu/nu $HOME/.cargo/bin/nu; echo "$HOME/.cargo/bin" >> $GITHUB_PATH; }
          nu --version
      - name: Install osv-scanner
        run: |
          V=v2.2.2
          curl -fsSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/$V/osv-scanner_linux_amd64
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner || { mkdir -p $HOME/.local/bin; install -m 0755 /tmp/osv-scanner $HOME/.local/bin/osv-scanner; echo "$HOME/.local/bin" >> $GITHUB_PATH; }
      - name: Audit dependencies (fails on any known vulnerability)
        run: nu scripts/security_audit.nu
