name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

# Cancel in-progress runs on the same branch/PR so we never queue up stale
# jobs after a force-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Self-hosted Gitea Act Runner: the container image backing `ubuntu-latest`
# doesn't reliably have a pre-existing, writable /opt/hostedtoolcache (the
# default RUNNER_TOOL_CACHE), which is what actions/setup-java@v4 extracts
# the JDK into and then lists right before failing ("Installed
# distributions" followed by a bare "Process completed with exit code 1",
# no further detail). Pointing it at a guaranteed-writable path fixes it.
env:
  RUNNER_TOOL_CACHE: /tmp/hostedtoolcache

jobs:
  # ── 1. Build ─────────────────────────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        # distribution: corretto, not temurin -- Temurin's actual binaries (and
        # its version-resolution API, api.adoptium.net) are both hosted via
        # github.com, which this runner can't reach (confirmed separately via
        # the kotlin-compiler-embeddable detekt dependency, and via sdkman's
        # own download broker, which redirects through github.com for Temurin
        # too). Corretto is hosted on AWS/CloudFront instead.
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
        with:
          # Pins the known-good gradle-wrapper.jar checksum for our pinned Gradle
          # version (verified against the official gradle/gradle v9.8.0 tag) so this
          # step never falls back to fetching checksums over the network — that
          # network fallback was flaking with ECONNRESET on the self-hosted runner.
          allow-checksums: 238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5

      - name: Build project
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Cleanup workspace
        if: always()
        run: |
          if command -v nu > /dev/null 2>&1; then
            nu scripts/cleanup.nu --ci
          else
            ./gradlew --stop 2>/dev/null || true
            rm -rf build kotlin-js-store
            rm -rf .gradle/buildOutputCleanup .gradle/expanded .gradle/kotlin .gradle/vcs-1 .gradle/file-system.probe
            find .gradle -maxdepth 1 -type d -regex '.*/[0-9].*' -exec rm -rf {} + 2>/dev/null || true
          fi

  # ── 2. Test ──────────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run tests (JVM + JS)
        run: ./gradlew jvmTest jsNodeTest --no-daemon --stacktrace

      - name: Cleanup workspace
        if: always()
        run: |
          if command -v nu > /dev/null 2>&1; then
            nu scripts/cleanup.nu --ci
          else
            ./gradlew --stop 2>/dev/null || true
            rm -rf build kotlin-js-store
            rm -rf .gradle/buildOutputCleanup .gradle/expanded .gradle/kotlin .gradle/vcs-1 .gradle/file-system.probe
            find .gradle -maxdepth 1 -type d -regex '.*/[0-9].*' -exec rm -rf {} + 2>/dev/null || true
          fi

  # ── 3. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run detekt / check
        run: ./gradlew check --no-daemon --stacktrace

      - name: Cleanup workspace
        if: always()
        run: |
          if command -v nu > /dev/null 2>&1; then
            nu scripts/cleanup.nu --ci
          else
            ./gradlew --stop 2>/dev/null || true
            rm -rf build kotlin-js-store
            rm -rf .gradle/buildOutputCleanup .gradle/expanded .gradle/kotlin .gradle/vcs-1 .gradle/file-system.probe
            find .gradle -maxdepth 1 -type d -regex '.*/[0-9].*' -exec rm -rf {} + 2>/dev/null || true
          fi

  # ── 4. Documentation ────────────────────────────────────────────────────────
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Dokka documentation
        run: ./gradlew dokkaGeneratePublicationHtml --no-daemon --stacktrace

      - name: Cleanup workspace
        if: always()
        run: |
          if command -v nu > /dev/null 2>&1; then
            nu scripts/cleanup.nu --ci
          else
            ./gradlew --stop 2>/dev/null || true
            rm -rf build kotlin-js-store
            rm -rf .gradle/buildOutputCleanup .gradle/expanded .gradle/kotlin .gradle/vcs-1 .gradle/file-system.probe
            find .gradle -maxdepth 1 -type d -regex '.*/[0-9].*' -exec rm -rf {} + 2>/dev/null || true
          fi
