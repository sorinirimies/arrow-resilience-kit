name: Release

on:
  push:
    tags:
      - "[0-9]*"
  # Manual fallback — trigger from the Gitea Actions UI if the tag push
  # ever silently skips or a re-run is needed without re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. 0.5.0) — must already exist on the repo"
        required: true
        default: ""

permissions:
  contents: write
  packages: write

# Only one release at a time.
concurrency:
  group: release
  cancel-in-progress: true

# Self-hosted Gitea Act Runner: see .gitea/workflows/ci.yml for why this is
# needed (actions/setup-java@v4 fails on this runner without it).
env:
  RUNNER_TOOL_CACHE: /tmp/hostedtoolcache

jobs:
  # ── 0. Validate tag ──────────────────────────────────────────────────────────
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # For workflow_dispatch, checkout's default ref is the branch that
      # triggered it (main), NOT the tag being released -- the tag comes
      # from the `tag` input instead. Checking out the requested tag
      # explicitly here is what lets the version check below compare
      # against that tag's own build.gradle.kts, not main's.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Install Nushell
        run: |
          NU_VERSION=0.116.1
          curl -sSfL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv "nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/

      - name: Validate tag
        id: resolve
        run: nu scripts/validate_tag.nu "$TAG" | tee -a "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Cleanup workspace
        if: always()
        run: nu scripts/cleanup.nu --ci

  # ── 1. Quality gate ──────────────────────────────────────────────────────────
  test:
    name: Build & Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
        with:
          # Pins the checksum of the gradle-wrapper.jar actually committed in this
          # repo (regenerated by the nightly deps-update bot -- not necessarily
          # byte-identical to gradle/gradle's own release tag, since jar generation
          # embeds timestamps, but that's fine: this only needs to match what's
          # actually checked out) so this step never falls back to fetching
          # checksums over the network -- that network fallback was flaking with
          # ECONNRESET on the self-hosted runner. Update this whenever the nightly
          # bot bumps gradle-wrapper.jar (shasum -a 256 gradle/wrapper/gradle-wrapper.jar).
          allow-checksums: 3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98

      - name: Build project
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Run all tests
        run: ./gradlew allTests --no-daemon --stacktrace

      - name: Cleanup workspace
        if: always()
        run: |
          if command -v nu > /dev/null 2>&1; then
            nu scripts/cleanup.nu --ci
          else
            ./gradlew --stop 2>/dev/null || true
            rm -rf build kotlin-js-store
            rm -rf .gradle/buildOutputCleanup .gradle/expanded .gradle/kotlin .gradle/vcs-1 .gradle/file-system.probe
            find .gradle -maxdepth 1 -type d -regex '.*/[0-9].*' -exec rm -rf {} + 2>/dev/null || true
          fi

  # ── 2. Create Release ────────────────────────────────────────────────────────
  release:
    name: Create Gitea Release
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          cargo install git-cliff --locked

      - name: Install Nushell
        run: |
          NU_VERSION=0.116.1
          curl -sSfL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv "nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/

      - name: Create Gitea Release
        run: >
          nu scripts/create_gitea_release.nu
          "${{ needs.validate.outputs.tag }}"
          --gitea-url "${{ github.server_url }}"
          --repo "${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Cleanup workspace
        if: always()
        run: nu scripts/cleanup.nu --ci

  # ── Publish targets: independent jobs, run in parallel ──────────────────────
  publish-github-packages:
    name: Publish → GitHub Packages
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HAS: ${{ secrets.PACKAGES_PUBLISH != '' }}
    steps:
      - name: Skip notice (no credentials)
        if: env.HAS == 'false'
        run: echo "⏭️  PACKAGES_PUBLISH not set — skipping."

      - uses: actions/checkout@v4
        if: env.HAS == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up JDK 17
        if: env.HAS == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        if: env.HAS == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Publish to GitHub Packages
        if: env.HAS == 'true'
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon
        env:
          PACKAGES_PUBLISH: ${{ secrets.PACKAGES_PUBLISH }}
          GITHUB_ACTOR: ${{ github.actor }}

  publish-gitea-packages:
    name: Publish → Gitea Packages
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HAS: ${{ secrets.GITEA_PACKAGES_TOKEN != '' }}
    steps:
      - name: Skip notice (no credentials)
        if: env.HAS == 'false'
        run: echo "⏭️  GITEA_PACKAGES_TOKEN not set — skipping."

      - uses: actions/checkout@v4
        if: env.HAS == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up JDK 17
        if: env.HAS == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        if: env.HAS == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Publish to Gitea Packages
        if: env.HAS == 'true'
        # Only meaningful from this self-hosted runner: GiteaPackages points at
        # a private LAN address unreachable from GitHub-hosted runners.
        run: ./gradlew publishAllPublicationsToGiteaPackagesRepository --no-daemon
        env:
          GITEA_PACKAGES_TOKEN: ${{ secrets.GITEA_PACKAGES_TOKEN }}
          GITEA_PACKAGES_URL: ${{ secrets.GITEA_PACKAGES_URL }}

  publish-maven-central:
    name: Publish → Maven Central
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HAS: ${{ secrets.SONATYPE_TOKEN != '' }}
    steps:
      - name: Skip notice (no credentials)
        if: env.HAS == 'false'
        run: echo "⏭️  SONATYPE_TOKEN not set — skipping."

      - uses: actions/checkout@v4
        if: env.HAS == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up JDK 17
        if: env.HAS == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        if: env.HAS == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Publish to Maven Central
        if: env.HAS == 'true'
        # publishToCentralPortal stages, zips, and uploads the bundle with
        # publishingType=AUTOMATIC (gradle/central-portal.gradle.kts), which
        # triggers Sonatype's auto validate+release; see INSTALLATION.md for
        # the one-time Central Portal namespace verification this requires.
        # SONATYPE_TOKEN is the <server> XML snippet from Central Portal
        # (contains <username> and <password>); parse it here.
        run: |
          U=$(printf '%s' "$SONATYPE_TOKEN" | sed -n 's:.*<username>\(.*\)</username>.*:\1:p' | head -1)
          P=$(printf '%s' "$SONATYPE_TOKEN" | sed -n 's:.*<password>\(.*\)</password>.*:\1:p' | head -1)
          if [ -z "$U" ] || [ -z "$P" ]; then echo "::error::SONATYPE_TOKEN missing <username>/<password>"; exit 1; fi
          echo "::add-mask::$U"; echo "::add-mask::$P"
          export ORG_GRADLE_PROJECT_mavenCentralUsername="$U"
          export ORG_GRADLE_PROJECT_mavenCentralPassword="$P"
          ./gradlew publishToCentralPortal --no-daemon
        env:
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-npm:
    name: Publish → npm
    needs: [validate]
    runs-on: ubuntu-latest
    env:
      HAS: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Skip notice (no credentials)
        if: env.HAS == 'false'
        run: echo "⏭️  NPM_TOKEN not set — skipping."

      - uses: actions/checkout@v4
        if: env.HAS == 'true'
        with:
          ref: ${{ needs.validate.outputs.tag }}

      # Retry: runner DNS flakes (getaddrinfo EAI_AGAIN corretto.github.io).
      - name: Set up JDK 17
        id: jdk1
        if: env.HAS == 'true'
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Set up JDK 17 (retry)
        if: env.HAS == 'true' && steps.jdk1.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Setup Gradle
        if: env.HAS == 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Node.js
        if: env.HAS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: env.HAS == 'true'
        # jsNodeProductionLibraryDistribution builds the npm-publishable package
        # (package.json + .d.ts + bundled JS, see build.gradle.kts's js { }
        # block and src/jsMain/kotlin/ -- see INTEROP.md for exactly what JS/TS
        # API surface this covers). actions/setup-node's registry-url already
        # wrote a project .npmrc wired to NODE_AUTH_TOKEN.
        run: |
          ./gradlew jsNodeProductionLibraryDistribution --no-daemon
          cd build/dist/js/productionLibrary
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
