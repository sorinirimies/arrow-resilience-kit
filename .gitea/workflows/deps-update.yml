name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:00 UTC every day (03:00 CET)
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: deps-update
  cancel-in-progress: true

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Install Nushell
        run: |
          NU_VERSION=$(curl -sSfL https://api.github.com/repos/nushell/nushell/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          curl -sSfL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv "nu-${NU_VERSION#v}-x86_64-unknown-linux-gnu/nu" /usr/local/bin/

      - name: Record HEAD before upgrade
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upgrade dependencies
        run: nu scripts/upgrade_deps.nu --commit --bot-name "gitea-actions[bot]" --bot-email "gitea-actions[bot]@noreply.gitea"

      - name: Check whether dependencies changed
        id: diff
        run: |
          after="$(git rev-parse HEAD)"
          if [ "$after" != "${{ steps.before.outputs.sha }}" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      # Bumps a patch version, tags it, and dispatches the Release workflow —
      # so a dependency upgrade automatically produces a new build/release.
      - name: Auto-release new version
        if: steps.diff.outputs.updated == 'true'
        run: >
          nu scripts/auto_release.nu
          --platform gitea
          --repo "${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}"
          --gitea-url "${{ github.server_url }}"

      - name: Cleanup workspace
        if: always()
        run: nu scripts/cleanup.nu --ci
