# Kotlin Configuration
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# The Kotlin Gradle plugin auto-adds a kotlin-stdlib dependency pinned to the
# exact compiler/toolchain version (2.4.20, needed for Arrow 2.2.3's native
# klib ABI -- see build.gradle.kts) to every published variant, regardless of
# compilerOptions.apiVersion. That forces kotlin-stdlib:2.4.20 onto every
# consumer's classpath even though our public API surface is restricted to
# apiVersion 2.2. Disabled here; build.gradle.kts adds an explicit
# kotlin-stdlib dependency pinned to 2.2.20 instead (see commonMain).
kotlin.stdlib.default.dependency=false

# Gradle Performance
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration on Demand is NOT enabled: Kotlin Multiplatform's JS target
# doesn't support it (see https://youtrack.jetbrains.com/issue/KT-52074),
# and Gradle warns it can cause "unpredictable and inconsistent behaviour"
# for this project's targets.

# Publishing Configuration
# Uncomment and set these for publishing to GitHub Packages
# gpr.user=your-github-username
# gpr.token=your-github-personal-access-token

# Optional: Signing Configuration for releases
# signingKey=your-signing-key
# signingPassword=your-signing-password
