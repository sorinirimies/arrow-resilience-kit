# Kotlin Configuration
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Gradle Performance
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration on Demand is NOT enabled: Kotlin Multiplatform's JS target
# doesn't support it (see https://youtrack.jetbrains.com/issue/KT-52074),
# and Gradle warns it can cause "unpredictable and inconsistent behaviour"
# for this project's targets.

# Publishing Configuration
# Uncomment and set these for publishing to GitHub Packages
# gpr.user=your-github-username
# gpr.token=your-github-personal-access-token

# Optional: Signing Configuration for releases
# signingKey=your-signing-key
# signingPassword=your-signing-password
